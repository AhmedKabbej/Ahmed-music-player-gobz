<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecteur de Playlist</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/src/button.css">
    <link rel="stylesheet" href="/src/style.css">
    <script src="https://unpkg.com/split-type"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>

<body>
    <h1>Lecteur de Playlist</h1>
    <div class="gapgutton">
        <button class="button-32" role="button" id="prev">⏮ Précédent</button>
        <button class="button-32" role="button" id="play">▶️ Play / Pause</button>
        <button class="button-32" role="button" id="next">⏭ Suivant</button>
    </div>
    <h2 id="track-title">Titre du morceau</h2>
    <ul id="playlist"></ul>



    <figure class="icon-cards mt-3">
        <div class="icon-cards__content">
          <div class="icon-cards__item d-flex align-items-center justify-content-center"><span id="splitH2" class="h1"><img src="public/Thestrokescover.jpg" alt="" width="250px"></span></div>
          <div class="icon-cards__item d-flex align-items-center justify-content-center"><span id="splitH2" class="h1"><img src="public/StromaeCover.jpg" alt="" width="250px"></span></div>
          <div class="icon-cards__item d-flex align-items-center justify-content-center"><span id="splitH2" class="h1"><img src="public/Pharrellwilliamscover.jpg" alt="" width="250px"></span></div>
          <div class="icon-cards__item d-flex align-items-center justify-content-center"><span id="splitH2" class="h1"><img src="public/Harrystylecover.jpg" alt="" width="250px"></span></div>
          <div class="icon-cards__item d-flex align-items-center justify-content-center"><span id="splitH2" class="h1"><img src="public/LPcover.jpg" alt="" width="250px"></span></div>
          <div class="icon-cards__item d-flex align-items-center justify-content-center"><span id="splitH2" class="h1"><img src="public/Toploadercover.jpg" alt="" width="250px"></span></div>
        </div>
      </figure>

</html>
